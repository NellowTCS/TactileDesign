<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no'/>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      canvas {
        display: block;
        outline: none;
        border: 1px solid #444;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"></canvas>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const width = parseInt(urlParams.get("w") || "480", 10);
      const height = parseInt(urlParams.get("h") || "320", 10);
      const canvas = document.getElementById("canvas");
      canvas.width = width;
      canvas.height = height;

      // Emscripten module config
      var Module = {
        canvas: canvas,
        arguments: [width.toString(), height.toString()],
        print: console.log,
        printErr: console.error,
        onRuntimeInitialized() {
          console.log("[LVGL] WASM Ready");

          // Optional: Auto-call a JS callback
          if (typeof window.onLvglReady === "function") {
            window.onLvglReady(Module);
          }

          // Create a global LVGL interface for React to use
          window.LVGL = {
            clear: () => Module._lvgl_clear_screen(),
            label: (x, y, text) => {
              const ptr = Module.allocateUTF8(text);
              Module._lvgl_create_label(x, y, ptr);
              Module._free(ptr);
            },
            button: (x, y, w, h, text) => {
              const ptr = Module.allocateUTF8(text);
              Module._lvgl_create_button(x, y, w, h, ptr);
              Module._free(ptr);
            },
          };
        }
      };

      window.addEventListener("click", () => window.focus());
    </script>

    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
