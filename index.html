<!DOCTYPE html>
<html>
<head>
    <title>Tactile Designer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .toolbar {
            width: 200px;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }
        .toolbar button {
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            border: none;
            background: #007acc;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .toolbar button:hover {
            background: #005999;
        }
        .canvas-container {
            flex: 1;
        }
        #designer-canvas {
            border: 2px solid #ddd;
            cursor: crosshair;
            background: white;
        }
        .selected {
            border: 2px solid #007acc !important;
        }
        .code-output {
            margin-top: 20px;
        }
        .code-output textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            background: #f8f8f8;
            border: 1px solid #ddd;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Tactile Designer</h1>
    
    <div class="container">
        <div class="toolbar">
            <h3>Widgets</h3>
            <button onclick="addWidget('button')">Add Button</button>
            <button onclick="addWidget('label')">Add Label</button>
            <button onclick="addWidget('slider')">Add Slider</button>
            
            <h3>Actions</h3>
            <button onclick="generateCode()">Generate C++ Code</button>
            <button onclick="clearCanvas()">Clear All</button>
        </div>
        
        <div class="canvas-container">
            <canvas id="designer-canvas" width="800" height="600"></canvas>
            
            <div class="code-output">
                <h3>Generated C++ Code:</h3>
                <textarea id="code-output" readonly></textarea>
            </div>
        </div>
    </div>

    <script type="module">
        import init, { TactileDesigner } from './pkg/tactile_designer.js';
        
        let designer;
        let canvas;
        let ctx;
        let selectedWidget = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let widgets = [];
        
        async function initDesigner() {
            await init();
            designer = new TactileDesigner();
            
            canvas = document.getElementById('designer-canvas');
            ctx = canvas.getContext('2d');
            
            setupEventHandlers();
            render();
            
            console.log('Designer initialized');
        }
        
        function setupEventHandlers() {
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
        }
        
        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            selectedWidget = findWidgetAt(x, y);
            
            if (selectedWidget) {
                isDragging = true;
                dragOffset = {
                    x: x - selectedWidget.x,
                    y: y - selectedWidget.y
                };
            }
            
            render();
        }
        
        function handleMouseMove(e) {
            if (isDragging && selectedWidget) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const newX = x - dragOffset.x;
                const newY = y - dragOffset.y;
                
                designer.update_widget_position(selectedWidget.id, newX, newY);
                selectedWidget.x = newX;
                selectedWidget.y = newY;
                
                render();
            }
        }
        
        function handleMouseUp() {
            isDragging = false;
        }
        
        function findWidgetAt(x, y) {
            for (let i = widgets.length - 1; i >= 0; i--) {
                const widget = widgets[i];
                if (x >= widget.x && x <= widget.x + widget.width &&
                    y >= widget.y && y <= widget.y + widget.height) {
                    return widget;
                }
            }
            return null;
        }
        
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // Draw widgets
            widgets.forEach(widget => {
                const isSelected = selectedWidget && selectedWidget.id === widget.id;
                
                ctx.fillStyle = getWidgetColor(widget.widget_type);
                ctx.strokeStyle = isSelected ? '#007acc' : '#666';
                ctx.lineWidth = isSelected ? 3 : 1;
                
                ctx.fillRect(widget.x, widget.y, widget.width, widget.height);
                ctx.strokeRect(widget.x, widget.y, widget.width, widget.height);
                
                // Draw widget label
                ctx.fillStyle = '#333';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(
                    widget.widget_type,
                    widget.x + widget.width / 2,
                    widget.y + widget.height / 2
                );
            });
        }
        
        function getWidgetColor(type) {
            switch (type) {
                case 'button': return '#e3f2fd';
                case 'label': return '#f3e5f5';
                case 'slider': return '#e8f5e8';
                default: return '#fafafa';
            }
        }
        
        // Global functions for buttons
        window.addWidget = function(type) {
            const id = designer.add_widget(type, 50, 50, 100, 50);
            
            const widget = {
                id,
                widget_type: type,
                x: 50,
                y: 50,
                width: 100,
                height: 50
            };
            
            widgets.push(widget);
            render();
        };
        
        window.generateCode = function() {
            const code = designer.generate_cpp_code();
            document.getElementById('code-output').value = code;
        };
        
        window.clearCanvas = function() {
            designer = new TactileDesigner();
            widgets = [];
            selectedWidget = null;
            render();
            document.getElementById('code-output').value = '';
        };
        
        // Initialize when page loads
        initDesigner();
    </script>
</body>
</html>
