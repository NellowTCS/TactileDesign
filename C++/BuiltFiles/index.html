<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LVGL Tactile Designer</title>
  <style>
    body {
      font-family: arial;
      margin: 0;
      padding: 0;
    }
    .emscripten {
      display: block;
      margin: auto;
      background-color: black;
      border: none;
    }
    div.emscripten {
      text-align: center;
    }
    #status {
      display: inline-block;
      vertical-align: top;
      margin: 10px 20px;
      font-weight: bold;
      color: rgb(120, 120, 120);
    }
    #spinner {
      height: 30px;
      width: 30px;
      display: inline-block;
      vertical-align: top;
      margin: 10px 20px;
      border-left: 5px solid rgb(235, 235, 235);
      border-right: 5px solid rgb(235, 235, 235);
      border-bottom: 5px solid rgb(235, 235, 235);
      border-top: 5px solid rgb(120, 120, 120);
      border-radius: 100%;
      background-color: rgb(189, 215, 46);
      animation: rotation 0.8s linear infinite;
    }
    @keyframes rotation {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    #controls {
      float: right;
      margin: 10px 20px;
    }
    #output {
      width: 100%;
      height: 200px;
      margin-top: 10px;
      display: block;
      background-color: rgb(255, 255, 255);
      color: rgb(0, 0, 0);
      font-family: 'Lucida Console', Monaco, monospace;
      outline: none;
    }
    #canvas {
      display: block;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <h1 style="text-align: center;">🎨 LVGL Designer</h1>

  <div id="spinner"></div>
  <div id="status">Loading...</div>

  <div id="controls">
    <input type="button" value="Export PNG" onclick="exportCanvas()" />
    <input type="button" value="Fullscreen" onclick="toggleFullscreen()" />
  </div>

  <progress id="progress" max="100" hidden></progress>

  <canvas id="canvas" class="emscripten" width="480" height="320"></canvas>

  <textarea id="output" rows="8"></textarea>

  <script>
    console.log('Script execution started.');
    window.addEventListener('error', (event) => {
      console.error('Script error:', event.message, event.filename, event.lineno, event.colno);
    });
    try {
      // Define Module before WASM script loads
      var Module = {
       canvas: document.getElementById("canvas"),
        print(...args) {
          const outputElement = document.getElementById("output");
          if (outputElement) {
            const text = args.join(" ");
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
          console.log(...args);
        },
        setStatus(text) {
          const statusElement = document.getElementById("status");
          const progressElement = document.getElementById("progress");
          const spinnerElement = document.getElementById("spinner");

          Module.setStatus.last ??= { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          const now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;

          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;

          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2]) * 100;
            progressElement.max = parseInt(m[4]) * 100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
          }

          if (statusElement) statusElement.innerHTML = text;
        },
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies || 0, left);
          Module.setStatus(left
            ? `Preparing... (${this.totalDependencies - left}/${this.totalDependencies})`
            : "All downloads complete."
          );
        },
        onRuntimeInitialized() {
          console.log('onRuntimeInitialized called', Module);
          console.log('Module before initializeDesigner:', Module);
          initializeDesigner(Module);
        }
      };

      window.onerror = function(event) {
        Module.setStatus("❌ Exception thrown, see JavaScript console");
        const spinner = document.getElementById("spinner");
        if (spinner) spinner.style.display = "none";
        Module.setStatus = (text) => {
          if (text) console.error("[post-exception status] " + text);
        };
      };

      function initializeDesigner(Module) {
        console.log("Module initialized:", Module);
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        if (!ctx) {
          console.error("❌ Failed to get canvas 2D context.");
          return;
        }
        console.log("Canvas context initialized.");
        try {
          const testImage = ctx.createImageData(800, 600);
          console.log("ImageData created successfully:", testImage);
        } catch (e) {
          console.error("Error creating ImageData:", e);
        }

        console.log("Calling 'start_lvgl'...");
        Module.ccall("start_lvgl");

        const statusEl = document.getElementById("status");
        if (statusEl) statusEl.textContent = "✅ LVGL Designer initialized!";

        canvas.addEventListener("mousemove", (e) => handleMouseEvent(e, "mousemove"));
        canvas.addEventListener("mousedown", (e) => handleMouseEvent(e, "mousedown"));
        canvas.addEventListener("mouseup", (e) => handleMouseEvent(e, "mouseup"));
        canvas.addEventListener("mouseenter", (e) => handleMouseEvent(e, "mouseenter"));
        canvas.addEventListener("mouseleave", (e) => handleMouseEvent(e, "mouseleave"));

        canvas.addEventListener("touchstart", (e) => handleTouchEvent(e, "touchstart"));
        canvas.addEventListener("touchmove", (e) => handleTouchEvent(e, "touchmove"));
        canvas.addEventListener("touchend", (e) => handleTouchEvent(e, "touchend"));
        canvas.addEventListener("touchcancel", (e) => handleTouchEvent(e, "touchcancel"));
      }

      function handleMouseEvent(e, type) {
        const canvas = document.getElementById("canvas");
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
      }

      function handleTouchEvent(e, type) {
        const canvas = document.getElementById("canvas");
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
      }

      function exportCanvas() {
        const canvas = document.getElementById("canvas");
        canvas.toBlob(blob => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "lvgl_export.png";
          a.click();
          URL.revokeObjectURL(a.href);
        }, "image/png");
      }

      function toggleFullscreen() {
        const canvas = document.getElementById("canvas");
        if (canvas.requestFullscreen) canvas.requestFullscreen();
        else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
        else if (canvas.mozRequestFullScreen) canvas.mozRequestFullScreen();
        else if (canvas.msRequestFullscreen) canvas.msRequestFullscreen();
      }
    } catch (error) {
      console.error("Global error:", error);
    }
    console.log('Script execution finished.');
  </script>

  <!-- Load Emscripten-built WASM wrapper -->
  <script type="text/javascript" src="my_lvgl_wasm.js"></script>
</body>
</html>
