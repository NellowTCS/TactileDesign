[package]
name = "tactile-designer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wee_alloc = { version = "0.4", optional = true }

[features]
default = []
wee_alloc = ["dep:wee_alloc"]

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "ImageData",
  "Window",
  "MouseEvent",
]

# For now, we'll use a simpler approach without full LVGL
# Once this works, we can add LVGL dependencies